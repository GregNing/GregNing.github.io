---
layout: default
---

<div class="page section-page">
  <header class="section-page__header">
    <p class="eyebrow">INDEX <span>/</span> {{ page.title | upcase }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="section-page__intro">{{ page.description }}</p>{% endif %}
  </header>
  <div class="section-page__body">
    {{ content }}
  </div>
</div>
