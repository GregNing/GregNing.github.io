<aside class="profile-card">
  <div class="profile-card__header">
    <p class="eyebrow">AUTHOR / 001</p>
    <div class="profile-card__image">
      <img src="{{ '/public/profile_img.jpg' | relative_url }}" alt="Greg Yang">
    </div>
    <h2>Greg Yang</h2>
    <p class="profile-card__role">Developer <span>·</span> Taipei, Taiwan</p>
  </div>

  <p class="profile-card__bio">把 web development、backend system 與日常踩坑，整理成下次可以直接回來查的工程筆記。</p>

  <div class="profile-card__stats" aria-label="網站統計">
    <div><strong>{{ site.posts | size }}</strong><span>NOTES</span></div>
    <div><strong>{{ site.tags | size }}</strong><span>TAGS</span></div>
  </div>

  <div class="profile-card__footer">
    <a href="{{ '/pages/about/' | relative_url }}" class="pjaxlink">About <span>↗</span></a>
    <a href="{{ site.author.url }}" target="_blank" rel="noopener" aria-label="前往 Greg 的 GitHub">
      <i class="fa fa-github" aria-hidden="true"></i>
    </a>
  </div>
</aside>
